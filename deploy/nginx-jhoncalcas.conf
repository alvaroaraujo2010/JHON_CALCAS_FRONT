server {
    listen 80;
    server_name app.jhoncalcas.com.co;

    # AUMENTO DE SUBIDA (imágenes de galería)
    client_max_body_size 50M;

    root /var/www/jhoncalcas/www;
    index index.html;

    # --- Estáticos Angular ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API (proxy al backend .NET) ---
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # --- Webhook MercadoPago (sin límite de subida) ---
    location /api/payments/webhook {
        client_max_body_size 5M;
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Imágenes de galería (uploads) ---
    location /uploads/ {
        proxy_pass http://127.0.0.1:5002/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Logs separados
    access_log /var/log/nginx/jhoncalcas_access.log;
    error_log  /var/log/nginx/jhoncalcas_error.log;
}
